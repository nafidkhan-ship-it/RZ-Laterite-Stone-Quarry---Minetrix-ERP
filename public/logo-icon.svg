<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F5D061" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="50%" stop-color="#0E1014" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="stoneFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#996515" stop-opacity="0.95" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Hexagon -->
  <rect width="512" height="512" rx="104" fill="url(#darkBg)" />
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />
  <rect x="28" y="28" width="456" height="456" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Quarry Rock & Mining Monogram Structure -->
  <!-- Geometrical Laterite Block / Crystal / Pickaxe crest -->
  <g transform="translate(256, 210)">
    <!-- Central Geometric Stone Block in Isometric 3D -->
    <!-- Top Face -->
    <polygon points="0,-100 86,-50 0,0 -86,-50" fill="#FFE79A" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-86,-50 0,0 0,100 -86,50" fill="url(#stoneFacet)" />
    <!-- Right Face -->
    <polygon points="0,0 86,-50 86,50 0,100" fill="#80530A" />

    <!-- Stylized R and Z cuts in Gold Accent -->
    <path d="M -45,-30 L -15,-30 Q 5,-30 5,-10 Q 5,10 -15,10 L -30,10 L -30,45" fill="none" stroke="#0D0F13" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -45,-30 L -45,45" fill="none" stroke="#0D0F13" stroke-width="10" stroke-linecap="round" />
    <path d="M 0,-5 L 35,45" fill="none" stroke="#0D0F13" stroke-width="10" stroke-linecap="round" />
    
    <path d="M 12,-10 L 45,-10 L 15,30 L 48,30" fill="none" stroke="#FFE79A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: RZ MINETRIX -->
  <text x="256" y="385" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="46" font-weight="900" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">RZ MINETRIX</text>
  
  <text x="256" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="700" letter-spacing="7" fill="#E5C365" text-anchor="middle" opacity="0.85">LATERITE STONE QUARRY</text>
</svg>
